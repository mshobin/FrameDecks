# FrameDecks cloud API (cloud/): typecheck and test every change; on main, deploy to staging when the
# Cloudflare secrets exist (cloud/README.md). Presenting never depends on this service.
name: Cloud API

on:
  push:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Workers runtime, local D1 with the migrations)
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID_STAGING }}
    steps:
      - name: Cloudflare secrets set?
        id: secrets
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, so nothing is deployed (see cloud/README.md)."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Use the staging database id
        if: steps.secrets.outputs.ready == 'true'
        run: sed -i '/\[\[env.staging.d1_databases\]\]/,/migrations_dir/ s/^database_id = ".*"/database_id = "'"$D1_DATABASE_ID"'"/' wrangler.toml
      - name: Apply D1 migrations (staging)
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply framedecks-staging --env staging --remote
      - name: Deploy (staging)
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy --env staging
