# Keeps the Actions list short: the newest runs of each workflow stay (10 by default), older runs and their logs go.
# Runs every Sunday, and by hand (Actions → Tidy workflow runs → Run workflow, with how many to keep).
# Nothing that matters lives only in a run: installers are on the Releases page and downloads.framedecks.com, database
# backups in the private R2 bucket. Runs still going are never touched, nor is this run. Runs of workflows that no
# longer exist (such as GitHub's "BuildFailed" placeholders) count as one workflow and are trimmed the same way.
name: Tidy workflow runs

on:
  schedule:
    - cron: "41 2 * * 0"      # Sundays 02:41 UTC (05:41 Kuwait)
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the newest runs to keep for each workflow"
        required: true
        default: "10"

permissions:
  actions: write             # delete workflow runs
  contents: read

concurrency:
  group: tidy-workflow-runs
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: ${{ github.event.inputs.keep || '10' }}
    steps:
      - name: Delete all but the newest runs of each workflow
        run: |
          set -euo pipefail
          case "$KEEP" in ''|*[!0-9]*) echo "::error::keep must be a number"; exit 1;; esac
          [ "$KEEP" -ge 1 ] || { echo "::error::keep must be at least 1"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate \
            --jq '.workflow_runs[] | [.workflow_id, .created_at, .id, .status] | @tsv' > runs.tsv
          echo "Runs found: $(wc -l < runs.tsv)"
          # newest first within each workflow; keep the first $KEEP, never this run or one still going
          sort -t$'\t' -k1,1 -k2,2r runs.tsv | awk -F'\t' -v keep="$KEEP" -v me="$GITHUB_RUN_ID" '
            { n[$1]++ }
            n[$1] > keep && $3 != me && $4 == "completed" { print $3 }' > delete.txt
          echo "To delete: $(wc -l < delete.txt)"
          deleted=0
          while read -r id; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" > /dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete run $id"
            fi
          done < delete.txt
          echo "Deleted $deleted runs; kept the newest $KEEP of each workflow." | tee -a "$GITHUB_STEP_SUMMARY"
