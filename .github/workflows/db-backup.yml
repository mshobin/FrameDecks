# An encrypted copy of the workspace database every night (free plan, docs/deployment/free-hosting.md, Part B).
# Supabase Free has no daily backups. The copy is encrypted with BACKUP_PASSPHRASE (only the owner knows it) before
# it leaves the runner, and kept 30 days with the run. Needs the repository secrets SUPABASE_DB_URL (Session pooler
# URI) and BACKUP_PASSPHRASE; does nothing until they exist. Restore: docs/operations/database-backup.md.
name: Database backup

on:
  schedule:
    - cron: "23 1 * * *"       # 01:23 UTC (04:23 Kuwait) every night
  workflow_dispatch:

permissions:
  contents: read
  issues: write      # only to open an issue when a run fails (step below)

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::SUPABASE_DB_URL / BACKUP_PASSPHRASE are not set yet (docs/deployment/free-hosting.md, Part B). Nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the code
        if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the PostgreSQL 17 client (matches Supabase)
        if: steps.ready.outputs.go == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Make the encrypted backup
        if: steps.ready.outputs.go == 'true'
        run: tools/db_backup.sh backup

      - name: Keep it for 30 days
        if: steps.ready.outputs.go == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framedecks-backup-${{ github.run_number }}
          path: |
            backup/*.tar.enc
            backup/*.tar.enc.sha256
            backup/*.tar.enc.mac
          retention-days: 30
          if-no-files-found: error

      - name: Tell the owner when this fails (one open issue, a comment per failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Database backup failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "It failed again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The scheduled run failed: $RUN. Open it to see the step that failed. Close this issue once it is green again."
          fi
