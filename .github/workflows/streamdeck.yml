name: Stream Deck plugin

on:
  push:
    branches: [main]
    paths:
      - "streamdeck/**"
      - ".github/workflows/streamdeck.yml"
  pull_request:
    branches: [main]
    paths:
      - "streamdeck/**"
      - ".github/workflows/streamdeck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build (one file, bin/plugin.js)
        run: npm run build
      - name: Validate the manifest
        run: npm run validate
      - name: Pack (double-click to install in Stream Deck)
        run: npm run pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FRAMEDECKS Stream Deck plugin
          path: streamdeck/dist/com.framedecks.control.streamDeckPlugin
          if-no-files-found: error
