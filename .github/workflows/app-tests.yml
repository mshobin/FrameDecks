# FrameDecks: the app's own tests on every push and pull request (the Windows installer build runs them too, on main).
#   - node tests/run.js: the store (Frames, Decks), the Meeting Workbook, the Teleprompter, the sync entities
#   - python -m unittest: data migration, the Meeting Form, the desktop settings, the camera's Decks
#   - the phone remote looks the same through the direct transport and through a loopback relay transport
#     (tools/remote_screens.py --transports): the seam the cloud relay will use changes nothing on screen
name: App tests

on:
  push:
    paths: ["app/**", "tests/**", "tools/remote_screens.py", "tools/make_entity_fixtures.js", "*.py", "vcam/**", ".github/workflows/app-tests.yml"]
  pull_request:
    paths: ["app/**", "tests/**", "tools/remote_screens.py", "tools/make_entity_fixtures.js", "*.py", "vcam/**", ".github/workflows/app-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript tests
        run: node tests/run.js
      - name: The entity fixtures are up to date with store.js
        run: |
          node tools/make_entity_fixtures.js
          git diff --exit-code tests/fixtures/entities || (echo "Run: node tools/make_entity_fixtures.js" && exit 1)
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install Playwright and Chromium
        run: |
          python -m pip install pillow playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: The remote looks the same through every transport
        run: python tools/remote_screens.py --transports
