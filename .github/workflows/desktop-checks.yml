# Fast checks for the desktop program on every push (audit roadmap step 2). The full Windows build and tests run in
# build-windows.yml; this catches Python lint errors, JavaScript syntax errors and broken doc links in a minute.
name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Python lint (ruff.toml)
        run: |
          python -m pip install ruff==0.16.8
          ruff check .

      - name: JavaScript syntax (app/js)
        run: for f in app/js/*.js; do node --check "$f"; done

      - name: Documentation links
        run: python tools/check_doc_links.py
