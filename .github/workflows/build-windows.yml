# Builds the installer "FrameDecks v<version>.exe" on a clean Windows machine at GitHub.
#   - Every push to "main" (or "Run workflow" on the Actions tab): the installer ("FrameDecks v<version>.exe") is attached to that run
#     under "Artifacts" (kept for 90 days).
#   - A version tag such as v3.1: the installer is also published on the Releases page (kept forever).
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the "release" job below (version tags) may write, to publish the Release.
# Every action is pinned to a full commit (the tag is in the comment), so a moved tag cannot change what runs here.
permissions:
  contents: read

# 7.1.2: version tags run one at a time, in the order pushed, so two publishes can never race on releases/index.json
# and latest.json. (GitHub keeps one waiting run per group: push one tag, let it finish, then the next.) Pushes to
# main keep their own group per branch.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'publish-releases' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025          # 9.2 pinned (was windows-latest): a new runner image never changes a release unannounced
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
      # 9.2 (audit M3): "signed" in the manifest comes from the signature check below actually passing, not a variable
      signed: ${{ steps.sigcheck.outcome == 'success' }}
    env:
      # Code signing by SignPath Foundation (free for open source, M-D1: docs/deployment/code-signing.md). Off until the
      # owner adds the SIGNPATH_API_TOKEN secret; until then every signing step is skipped and the build is as before.
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      INNO_VERSION: "6.7.1"              # the installer compiler, pinned (audit L9): the build fails on any other
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-lock.txt

      # 9.3 (audit M5): every package at its pinned version with its SHA-256 (packaging/requirements-lock.txt); pip
      # refuses anything else. The runner's own pip is used as it is (no unpinned upgrade).
      - name: Install build tools
        run: |
          python -m pip install --require-hashes --no-deps -r packaging/requirements-lock.txt

      # 7.1.1: Microsoft Defender quarantined 7.1. PyInstaller's prebuilt launcher is shared by many programs, malware
      # among them, so antivirus models often flag it; building it from source gives FrameDecks its own. Same version
      # as packaging/constraints.txt. PyInstaller builds it with the Visual Studio already on the runner.
      - name: Build PyInstaller's launcher from source (fewer antivirus false alarms)
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
          # 9.2 (audit M5): the build backend pip fetches to compile PyInstaller (setuptools) is the pinned one too
          PIP_CONSTRAINT: packaging/constraints.txt
        run: |
          $v = (Select-String -Path packaging/constraints.txt -Pattern '^pyinstaller==(.+)$').Matches[0].Groups[1].Value
          # the same PyInstaller source the lock file names, checked against its hash
          $lock = Get-Content packaging/requirements-lock.txt
          $at = ($lock | Select-String -Pattern "^pyinstaller==$([regex]::Escape($v))" | Select-Object -First 1).LineNumber
          $entry = @($lock[$at - 1]); $i = $at
          while ($i -lt $lock.Count -and $lock[$i] -match '^\s+--hash=') { $entry += $lock[$i]; $i++ }
          $entry | Set-Content pyinstaller-src.txt
          python -m pip install --no-cache-dir --force-reinstall --no-deps --no-binary pyinstaller --require-hashes -r pyinstaller-src.txt
          if ($LASTEXITCODE -ne 0) { throw "Building PyInstaller's launcher failed" }
          $boot = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel')"
          Get-ChildItem $boot | Format-Table Name, Length, LastWriteTime
          $fresh = Get-ChildItem $boot -Filter 'runw.exe' | Where-Object { $_.LastWriteTime -gt (Get-Date).AddHours(-2) }
          if (-not $fresh) { throw "runw.exe was not built in this run" }

      - name: Get softcam (MIT licence) for the FrameDecks vCam
        shell: pwsh
        run: |
          # Pinned to the commit behind v1.8.1: the build stops if the tag ever points somewhere else
          git clone --depth 1 --branch v1.8.1 https://github.com/tshino/softcam.git vcam_build/softcam
          $got = (git -C vcam_build/softcam rev-parse HEAD).Trim()
          if ($got -ne 'afb424c2415b04da627fa1a7b4706575c2ba3010') { throw "softcam v1.8.1 is now $got, not the reviewed commit" }

      - name: Prepare the FrameDecks vCam (name and ID)
        run: python packaging/build_vcam.py vcam_build/softcam

      - name: Set up the Microsoft C++ compiler
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build the FrameDecks vCam (64-bit and 32-bit)
        shell: pwsh
        run: |
          foreach ($p in 'x64', 'Win32') {
            msbuild vcam_build/softcam/softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=$p
            if ($LASTEXITCODE -ne 0) { throw "FrameDecks vCam build failed ($p)" }
          }
          Copy-Item vcam_build/softcam/x64/Release/softcam.dll src/vcam/bin/framedecks_vcam64.dll
          Copy-Item vcam_build/softcam/Win32/Release/softcam.dll src/vcam/bin/framedecks_vcam32.dll
          # A record of what was built, so the app can tell "never built" from "removed after installing"
          $files = @{}
          foreach ($f in 'framedecks_vcam64.dll', 'framedecks_vcam32.dll') { $files[$f] = (Get-FileHash "src/vcam/bin/$f" -Algorithm SHA256).Hash }
          @{ builtBy = 'GitHub Actions'; run = '${{ github.run_number }}'; commit = '${{ github.sha }}'; files = $files } |
            ConvertTo-Json | Set-Content -Encoding utf8 src/vcam/bin/build-info.json
          # 9.3 (audit H4): the name the camera's copy in Program Files gets (register-framedecks-camera.cmd), from the
          # two files' content, so Windows asks for permission again only when the camera itself changed
          $tag = (Get-FileHash -InputStream ([IO.MemoryStream]::new([Text.Encoding]::ASCII.GetBytes($files['framedecks_vcam64.dll'] + $files['framedecks_vcam32.dll']))) -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          [IO.File]::WriteAllText("$PWD/src/vcam/bin/vcam-tag.txt", $tag)
          Write-Host "Camera tag: $tag"
          Get-ChildItem src/vcam/bin

      - name: Self-check (program starts and serves its pages)
        run: python packaging/check.py

      - name: Run the tests (Node.js)
        run: node tests/run.js

      - name: Run the desktop tests (Python, on Windows)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check documentation links
        run: python tools/check_doc_links.py

      - name: Check this version's release notes (What's New, Enhancements, Fixes, Performance, Known Issues)
        run: python tools/make_release_notes.py --check

      - name: Read version number
        id: ver
        shell: pwsh
        run: |
          $v = (python packaging/get_version.py).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      # 7.1.2: a version tag must name the version in src/server.py, and only a pushed tag releases (a manual run from a
      # tag, or a tag on a commit with another version, would republish or roll back a published release).
      - name: The tag must match the version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # 9.2 (audit L8): the tag name reaches the script as data, never as script text
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          WANT: v${{ steps.ver.outputs.version }}
        run: |
          if ($env:TAG -ne $env:WANT) { throw "Tag $($env:TAG) does not match APP_VERSION in src/server.py ($($env:WANT))" }
          if ($env:EVENT -ne "push") { throw "Releases are published only by pushing a version tag, not by a manual run" }
          Write-Host "Tag $($env:TAG) matches APP_VERSION"
          # 9.2 (audit M4): only a commit that is on main is released (a tag on a side branch, or on a commit that never
          # went through main and its checks, is refused)
          git fetch --no-tags --depth=500 origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $($env:TAG) is not on main: tag a commit from main" }
          Write-Host "The tagged commit is on main"

      - name: Build in the cloud's address and publishable key (9.10.3; the website stays the backup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python tools/write_cloud_builtin.py

      # 26.11.2 the speech engine for Follow my voice goes into the installer, so the installed app never downloads
      # program code (an unsigned program that downloads a DLL and loads it is what antivirus programs look for). The
      # same pinned file as src/voice_files.json, refused unless its size and SHA-256 match.
      - name: Put the speech engine in (Follow my voice)
        shell: pwsh
        run: |
          $rt = (Get-Content src/voice_files.json -Raw | ConvertFrom-Json).runtime
          $zip = Join-Path $env:RUNNER_TEMP $rt.name
          $got = $false
          foreach ($u in @("https://downloads.framedecks.com/voice/$($rt.name)", $rt.upstream)) {
            try { Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing; $got = $true; break } catch { Write-Host "Not from $($u): $($_.Exception.Message)" }
          }
          if (-not $got) { throw "Could not get $($rt.name)" }
          if ((Get-Item $zip).Length -ne $rt.size) { throw "$($rt.name) has the wrong size" }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $rt.sha256) { throw "$($rt.name) does not match its SHA-256" }
          $tmp = Join-Path $env:RUNNER_TEMP "vosk-rt"
          Expand-Archive $zip -DestinationPath $tmp -Force
          New-Item -ItemType Directory -Force src/voice_runtime | Out-Null
          foreach ($f in $rt.keep) {
            $hit = Get-ChildItem $tmp -Recurse -Filter $f | Select-Object -First 1
            if (-not $hit) { throw "$f is missing from $($rt.name)" }
            Copy-Item $hit.FullName src/voice_runtime/
          }
          Get-ChildItem src/voice_runtime

      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/framedecks.spec --distpath dist --workpath build

      - name: Check the app folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/FRAMEDECKS/FRAMEDECKS.exe")) { throw "The app was not built" }
          if (-not (Get-ChildItem -Recurse "dist/FRAMEDECKS" -Filter dashboard.html)) { throw "App pages are missing" }
          if (-not (Get-ChildItem -Recurse "dist/FRAMEDECKS" -Filter framedecks_vcam64.dll)) { throw "FrameDecks is missing" }
          if (-not (Test-Path "dist/FRAMEDECKS/_internal/voice_runtime/libvosk.dll")) { throw "The speech engine (Follow my voice) is missing" }
          if (-not (Get-ChildItem -Recurse "dist/FRAMEDECKS" -Filter cloud_builtin.json)) { Write-Host "::notice::No built-in cloud address (SUPABASE_URL / SUPABASE_ANON_KEY secrets not set): new PCs ask the website, as before" }

      - name: Hand the program folder to SignPath (signing on)
        id: unsigned_app
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-program
          path: dist/FRAMEDECKS
          if-no-files-found: error

      - name: Sign FRAMEDECKS.exe and the camera DLLs (signing on)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: program
          github-artifact-id: ${{ steps.unsigned_app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/FRAMEDECKS

      - name: Install Inno Setup (the pinned version)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          $have = if ($iscc) { (Get-Item $iscc).VersionInfo.ProductVersion } else { "" }
          Write-Host "Inno Setup on this runner: '$have' (pinned: $env:INNO_VERSION)"
          if (-not $have -or -not $have.StartsWith($env:INNO_VERSION)) {
            choco install innosetup --version $env:INNO_VERSION -y --no-progress --force --allow-downgrade
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup $env:INNO_VERSION" }
          }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $out = & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/installer.iss 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { throw "Inno Setup failed" }
          if (-not ($out -match "Compiler engine version: Inno Setup $([regex]::Escape($env:INNO_VERSION))\s*$")) {
            throw "The installer was not built with Inno Setup $env:INNO_VERSION (see the compiler line above)"
          }

      - name: Hand the installer to SignPath (signing on)
        id: unsigned_installer
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer
          path: dist/FrameDecks v*.exe
          if-no-files-found: error

      - name: Sign the installer (signing on)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Check the signatures (signing on)
        id: sigcheck
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "dist/FrameDecks v*.exe") + @(Get-Item "dist/FRAMEDECKS/FRAMEDECKS.exe") +
                   @(Get-ChildItem -Recurse "dist/FRAMEDECKS" -Filter "framedecks_vcam*.dll")
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($s.Status)  $($f.Name)"
            if ($s.Status -ne 'Valid') { throw "Not signed: $($f.Name)" }
          }

      # 26.11.2 until the installer is signed: Microsoft Defender, with today's signatures, checks the program folder and
      # the installer before anything is published. If it flags either, the release stops here, so no one downloads
      # an installer that Defender would remove (submit the file to Microsoft as a false positive, then run again:
      # docs/deployment/code-signing.md).
      - name: Scan with Microsoft Defender (the release stops if anything is flagged)
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "::warning::Microsoft Defender is not on this runner, so nothing was scanned"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Defender's signatures could not be updated (exit $LASTEXITCODE); scanning with the ones it has" }
          $targets = @((Resolve-Path "dist/FRAMEDECKS").Path) + @(Get-ChildItem dist -Filter "FrameDecks v*.exe" | ForEach-Object FullName)
          $flagged = @(); $scanned = 0
          foreach ($t in $targets) {
            $out = & $mp -Scan -ScanType 3 -File $t -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -eq 2) { $flagged += $t }
            elseif ($code -eq 0) { $scanned++ }
            else { Write-Host "::warning::Defender could not scan $t (exit $code)" }
          }
          if ($flagged.Count) { throw "Microsoft Defender flags: $($flagged -join ', '). Nothing was published." }
          "- Microsoft Defender: $scanned of $($targets.Count) scanned, nothing flagged" >> $env:GITHUB_STEP_SUMMARY

      - name: Write the SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem "dist/FrameDecks v*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$hash  $($_.Name)"
          }

      - name: Attach the installer to this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FrameDecks v${{ steps.ver.outputs.version }}
          path: |
            dist/FrameDecks v*.exe
            dist/FrameDecks v*.exe.sha256
          if-no-files-found: error

      - name: Smoke test the installer (install, start, answer, quit, uninstall)
        shell: pwsh
        run: |
          # Audit roadmap step 2: the real installer on a clean Windows machine, without the camera task (it needs
          # administrator permission). The program must answer on its local port, then uninstall cleanly.
          $setup = (Get-ChildItem "dist/FrameDecks v*.exe" | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!vcam,!desktopicon' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\FRAMEDECKS'
          if (-not (Test-Path (Join-Path $dir 'FRAMEDECKS.exe'))) { throw "FRAMEDECKS.exe was not installed in $dir" }
          # 9.3 (audit H4): the camera registers from its copy in Program Files (named by vcam-tag.txt) and is removed
          # cleanly again. The runner is an administrator, so the scripts run here without a prompt.
          $bin = Join-Path $dir '_internal\vcam\bin'
          $tag = (Get-Content (Join-Path $bin 'vcam-tag.txt') -Raw).Trim()
          $clsid = 'Registry::HKEY_CLASSES_ROOT\CLSID\{6F2B8C3E-4D7A-4B9E-9C11-B5CC0A1E7D21}'
          & (Join-Path $bin 'register-framedecks-camera.cmd')
          if ($LASTEXITCODE -ne 0) { throw "registering the camera failed ($LASTEXITCODE)" }
          $want = Join-Path $env:ProgramFiles "FrameDecks vCam\framedecks_vcam64-$tag.dll"
          $got = (Get-ItemProperty "$clsid\InprocServer32").'(default)'
          if ($got -ne $want) { throw "the camera is registered from '$got', not '$want'" }
          Write-Host "Camera registered from $got"
          & (Join-Path $bin 'unregister-framedecks-camera.cmd')
          if (Test-Path $clsid) { throw "the camera is still registered after removing it" }
          if (Test-Path (Join-Path $env:ProgramFiles 'FrameDecks vCam')) { throw "the camera's folder is still there after removing it" }
          $env:KC_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fd-smoke-data'
          $app = Start-Process (Join-Path $dir 'FRAMEDECKS.exe') -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8750/api/app/ping' -TimeoutSec 3
              if ($r.app -eq 'FRAMEDECKS') { Write-Host "Answered: FRAMEDECKS $($r.version)"; $ok = $true; break }
            } catch { }
          }
          & taskkill /F /T /IM FRAMEDECKS.exe | Out-Null
          if (-not $ok) {
            $log = Join-Path $env:KC_DATA_DIR 'kc-app-log.txt'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "the installed program did not answer on 127.0.0.1:8750 within 2 minutes"
          }
          Start-Sleep -Seconds 3
          $un = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($un.ExitCode -ne 0) { throw "uninstaller exit code $($un.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'FRAMEDECKS.exe')) { throw "FRAMEDECKS.exe is still there after uninstalling" }
          Write-Host "Installed, answered, quit and uninstalled cleanly."

      - name: Write the branded release notes (the About screen's header, then the notes)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/make_release_notes.py --version ${{ steps.ver.outputs.version }} --repo ${{ github.repository }} --ref ${{ github.sha }} --out dist/release-notes.md

      - name: Keep the release notes for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error

  # A private record of each version on the GitHub Releases page (the repository is private: users download from
  # framedecks.com, published by the "publish" job below). The only job with write access, and only for version tags.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FrameDecks v${{ needs.build.outputs.version }}
          path: dist

      - name: Get the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: dist

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # 26.11.63 the release is titled YY.MM.Build (26.11.63); the tag stays v26.11.63 (manifests and the updater use it)
          name: ${{ needs.build.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/FrameDecks v*.exe
            dist/FrameDecks v*.exe.sha256
          generate_release_notes: false

  # 7.0: publish to FrameDecks' own download service (docs/deployment/release-pipeline.md). Uploads the installer, its
  # checksum and the release manifest to the Cloudflare R2 bucket behind downloads.framedecks.com; api.framedecks.com
  # (infra/update-api) serves the manifest to the program's updater and the website's download page. Needs the
  # repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY and the variables R2_ACCOUNT_ID and R2_BUCKET; until
  # they exist it says so and publishes nothing. Files under releases/<version>/ never change once uploaded; the
  # manifest that points at them is uploaded last.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      R2_ON: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_ACCOUNT_ID != '' }}
      VERSION: ${{ needs.build.outputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET || 'framedecks-downloads' }}
      # 7.1.2 (F2): AWS CLI 2.23+ adds new integrity checksums to every request; R2 has rejected some of them. Send them
      # only when an operation requires one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Get the code (the manifest tool and the release notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FrameDecks v${{ needs.build.outputs.version }}
          path: dist

      # 7.1.2: read straight from the bucket (not the cached public address), and stop on any error except "there is no
      # index yet" (the first release). A version already published is never replaced: its installer is cached for a year,
      # so a rebuilt one (never byte-identical) would no longer match its published SHA-256.
      - name: Read the releases already published (from R2)
        if: env.R2_ON == 'true'
        run: |
          set -euo pipefail
          s3head() { aws s3api head-object --bucket "$BUCKET" --key "$1" --endpoint-url "$R2" > /dev/null 2> head-err.txt; }
          if s3head "releases/${VERSION}/manifest.json"; then
            echo "::error::FrameDecks ${VERSION} is already published; published versions never change. Bump APP_VERSION and tag the new version."
            exit 1
          elif ! grep -qE "\(404\)|Not Found" head-err.txt; then
            cat head-err.txt; echo "::error::Could not check R2 for ${VERSION}"; exit 1
          fi
          if s3head releases/index.json; then
            aws s3 cp "s3://${BUCKET}/releases/index.json" index.json --endpoint-url "$R2" --only-show-errors
          elif grep -qE "\(404\)|Not Found" head-err.txt; then
            echo '{"releases":[]}' > index.json
            echo "No index yet: this is the first release."
          else
            cat head-err.txt; echo "::error::Could not read releases/index.json from R2"; exit 1
          fi

      - name: No R2 yet (the layout is still written and checked)
        if: env.R2_ON != 'true'
        run: echo '{"releases":[]}' > index.json

      # 9.2 (audit H3): the manifest is signed with MANIFEST_SIGNING_KEY (tools/manifest_key.py); once the program trusts a
      # key, publishing without the secret stops here. "--signed" only when the build's signature check passed (M3).
      - name: Lay out the release and write its manifest
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          python3 tools/make_release_manifest.py --installer "dist/FrameDecks v${VERSION}.exe" --out publish --index index.json \
            ${{ needs.build.outputs.signed == 'true' && '--signed' || '' }}
          find publish -type f | sort

      - name: Upload to Cloudflare R2
        if: env.R2_ON == 'true'
        run: |
          set -euo pipefail
          exe="FrameDecks-${VERSION}-Setup.exe"
          up() { aws s3 cp "$1" "s3://${BUCKET}/$2" --endpoint-url "$R2" --only-show-errors "${@:3}"; }
          up "publish/releases/${VERSION}/${exe}" "releases/${VERSION}/${exe}" \
            --content-type application/vnd.microsoft.portable-executable --content-disposition "attachment; filename=\"${exe}\"" \
            --cache-control "public, max-age=31536000, immutable"
          up "publish/releases/${VERSION}/${exe}.sha256" "releases/${VERSION}/${exe}.sha256" --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
          up "publish/releases/${VERSION}/manifest.json" "releases/${VERSION}/manifest.json" --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          up publish/latest/FrameDecks-Setup.exe latest/FrameDecks-Setup.exe \
            --content-type application/vnd.microsoft.portable-executable --content-disposition 'attachment; filename="FrameDecks-Setup.exe"' \
            --cache-control "public, max-age=300"
          up publish/releases/index.json releases/index.json --content-type application/json --cache-control "public, max-age=300"
          up publish/releases/latest.json releases/latest.json --content-type application/json --cache-control "public, max-age=300"
          echo "Published ${VERSION}: https://downloads.framedecks.com/releases/${VERSION}/${exe}"

      # 7.1.2 (F1): a version tag that cannot publish fails, so a missing or misnamed setting is never a green run.
      - name: Say what is missing (R2 not set up yet)
        if: env.R2_ON != 'true'
        run: |
          echo "::error::R2 is not set up (secrets R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY, variables R2_ACCOUNT_ID/R2_BUCKET), so ${VERSION} was not published to downloads.framedecks.com. See docs/deployment/release-pipeline.md."
          exit 1
