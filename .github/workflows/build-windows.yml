# Builds the installer "Kingdom Connect v<version>.exe" on a clean Windows machine at GitHub.
#   - Every push to "main" (or "Run workflow" on the Actions tab): the installer ("Kingdom Connect v<version>.exe") is attached to that run
#     under "Artifacts" (kept for 90 days).
#   - A version tag such as v3.1: the installer is also published on the Releases page (kept forever).
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish Releases for version tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-desktop.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-desktop.txt -c packaging/constraints.txt

      - name: Get softcam (MIT licence) for KingdomConnect
        run: git clone --depth 1 --branch v1.8.1 https://github.com/tshino/softcam.git vcam_build/softcam

      - name: Prepare KingdomConnect (name and ID)
        run: python packaging/build_vcam.py vcam_build/softcam

      - name: Get VCamSample (MIT licence) for the Windows 11 KingdomConnect camera
        run: |
          git clone https://github.com/smourier/VCamSample.git vcam_build/vcamsample
          git -C vcam_build/vcamsample checkout --quiet 58b6d4b0e0c2c97fdffd66d23e7c8da6b89f570d

      - name: Prepare the Windows 11 KingdomConnect camera (picture, name and ID)
        run: python packaging/build_mfcam.py vcam_build/vcamsample

      - name: Set up the Microsoft C++ compiler
        uses: microsoft/setup-msbuild@v2

      - name: Build KingdomConnect (64-bit and 32-bit)
        shell: pwsh
        run: |
          foreach ($p in 'x64', 'Win32') {
            msbuild vcam_build/softcam/softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=$p
            if ($LASTEXITCODE -ne 0) { throw "KingdomConnect build failed ($p)" }
          }
          Copy-Item vcam_build/softcam/x64/Release/softcam.dll vcam/bin/kingdomconnect_vcam64.dll
          Copy-Item vcam_build/softcam/Win32/Release/softcam.dll vcam/bin/kingdomconnect_vcam32.dll
          # The Windows 11 camera (Media Foundation). The Visual Studio on the build machine sets the C++ toolset.
          nuget restore vcam_build/vcamsample/VCamSampleSource/packages.config -PackagesDirectory vcam_build/vcamsample/packages
          if ($LASTEXITCODE -ne 0) { throw "VCamSample packages could not be restored" }
          foreach ($p in 'x64', 'Win32') {
            msbuild vcam_build/vcamsample/VCamSampleSource/VCamSampleSource.vcxproj /m /p:Configuration=Release /p:Platform=$p /p:PlatformToolset=v143 /p:SolutionDir="$PWD/vcam_build/vcamsample/"
            if ($LASTEXITCODE -ne 0) { throw "KingdomConnect (Windows 11) build failed ($p)" }
          }
          $mf64 = Get-ChildItem -Recurse vcam_build/vcamsample -Filter VCamSampleSource.dll | Where-Object { $_.FullName -match '\\x64\\Release\\' } | Select-Object -First 1
          $mf32 = Get-ChildItem -Recurse vcam_build/vcamsample -Filter VCamSampleSource.dll | Where-Object { $_.FullName -match '\\Release\\' -and $_.FullName -notmatch '\\x64\\' } | Select-Object -First 1
          if (-not $mf64 -or -not $mf32) { Get-ChildItem -Recurse vcam_build/vcamsample -Filter *.dll | Format-Table FullName; throw "KingdomConnect (Windows 11) output not found" }
          Copy-Item $mf64.FullName vcam/bin/kingdomconnect_mfcam64.dll
          Copy-Item $mf32.FullName vcam/bin/kingdomconnect_mfcam32.dll
          # A record of what was built, so the app can tell "never built" from "removed after installing"
          $files = @{}
          foreach ($f in 'kingdomconnect_vcam64.dll', 'kingdomconnect_vcam32.dll', 'kingdomconnect_mfcam64.dll', 'kingdomconnect_mfcam32.dll') { $files[$f] = (Get-FileHash "vcam/bin/$f" -Algorithm SHA256).Hash }
          @{ builtBy = 'GitHub Actions'; run = '${{ github.run_number }}'; commit = '${{ github.sha }}'; files = $files } |
            ConvertTo-Json | Set-Content -Encoding utf8 vcam/bin/build-info.json
          Get-ChildItem vcam/bin

      - name: Self-check (program starts and serves its pages)
        run: python packaging/check.py

      - name: Run the tests (Node.js)
        run: node tests/run.js

      - name: Run the desktop tests (Python, on Windows)
        env:
          KC_CAMERA_E2E: "1"   # installs the Windows 11 KingdomConnect camera, reads it back, removes it (needs admin)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check documentation links
        run: python tools/check_doc_links.py

      - name: Check this version's release notes (What's New, Enhancements, Fixes, Performance, Known Issues)
        run: python tools/make_release_notes.py --check

      - name: Read version number
        id: ver
        shell: pwsh
        run: |
          $v = (python packaging/get_version.py).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/kingdom-connect.spec --distpath dist --workpath build

      - name: Check the app folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Kingdom Connect/Kingdom Connect.exe")) { throw "The app was not built" }
          if (-not (Get-ChildItem -Recurse "dist/Kingdom Connect" -Filter dashboard.html)) { throw "App pages are missing" }
          if (-not (Get-ChildItem -Recurse "dist/Kingdom Connect" -Filter kingdomconnect_vcam64.dll)) { throw "KingdomConnect is missing" }

      - name: Install Inno Setup (if needed)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Write the SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem "dist/Kingdom Connect v*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$hash  $($_.Name)"
          }

      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom Connect v${{ steps.ver.outputs.version }}
          path: |
            dist/Kingdom Connect v*.exe
            dist/Kingdom Connect v*.exe.sha256
          if-no-files-found: error

      - name: Write the branded release notes (the About screen's header, then the notes)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/make_release_notes.py --version ${{ steps.ver.outputs.version }} --repo ${{ github.repository }} --ref ${{ github.sha }} --out dist/release-notes.md

      - name: Publish on the Releases page (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kingdom Connect ${{ steps.ver.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/Kingdom Connect v*.exe
            dist/Kingdom Connect v*.exe.sha256
          generate_release_notes: false
