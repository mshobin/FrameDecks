# Builds BSF-Command-Center-Setup-<version>.exe on a clean Windows machine at GitHub.
#   - Every push to "main" (or "Run workflow" on the Actions tab): the installer is attached to that run
#     under "Artifacts" (kept for 90 days).
#   - A version tag such as v3.1: the installer is also published on the Releases page (kept forever).
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish Releases for version tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-desktop.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-desktop.txt

      - name: Self-check (program starts and serves its pages)
        run: python packaging/check.py

      - name: Read version number
        id: ver
        shell: pwsh
        run: |
          $v = (python packaging/get_version.py).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/bsf.spec --distpath dist --workpath build

      - name: Check the app folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BSF Command Center/BSF Command Center.exe")) { throw "The app was not built" }
          if (-not (Get-ChildItem -Recurse "dist/BSF Command Center" -Filter dashboard.html)) { throw "App pages are missing" }

      - name: Install Inno Setup (if needed)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: BSF-Command-Center-Setup-${{ steps.ver.outputs.version }}
          path: dist/BSF-Command-Center-Setup-*.exe
          if-no-files-found: error

      - name: Publish on the Releases page (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BSF-Command-Center-Setup-*.exe
          generate_release_notes: true
