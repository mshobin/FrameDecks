name: Hosted companion checks

on:
  push:
    branches: [main, modernization-v1]
    paths:
      - "hosted/**"
      - "tests/fixtures/sync/**"
      - ".github/workflows/hosted.yml"
  pull_request:
    branches: [main, modernization-v1]
    paths:
      - "hosted/**"
      - "tests/fixtures/sync/**"
      - ".github/workflows/hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosted/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test hosted boundaries
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget (gzipped JavaScript and CSS)
        run: node scripts/check-budget.mjs
