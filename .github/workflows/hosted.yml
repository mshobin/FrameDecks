name: Hosted companion checks

on:
  push:
    branches: [main, modernization-v1]
    paths:
      - "hosted/**"
      - "tests/fixtures/sync/**"
      - "infra/site/**"
      - ".github/workflows/hosted.yml"
  pull_request:
    branches: [main, modernization-v1]
    paths:
      - "hosted/**"
      - "tests/fixtures/sync/**"
      - "infra/site/**"
      - ".github/workflows/hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosted/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test hosted boundaries
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget (gzipped JavaScript and CSS)
        run: node scripts/check-budget.mjs

      - name: The built site is complete (pages, headers, setup file)
        run: node scripts/verify-site.mjs

  # framedecks.com on Cloudflare Pages (docs/deployment/cloudflare-pages.md). Only after every check above passed, only
  # for main, one deploy at a time. The build uses the same two public values the Windows build uses (repository
  # secrets SUPABASE_URL and SUPABASE_ANON_KEY: the address and the publishable key every browser receives anyway).
  # Until the owner adds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID it says so and skips, so nothing turns red.
  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Not deployed: add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deployment/cloudflare-pages.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::The repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are needed to build the website."
            exit 1
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosted/package-lock.json

      - name: Build the website
        if: steps.ready.outputs.go == 'true'
        working-directory: hosted
        run: |
          npm ci
          npm run build
          node scripts/check-budget.mjs
          node scripts/verify-site.mjs --cloud

      - name: Deploy to Cloudflare Pages (production)
        if: steps.ready.outputs.go == 'true'
        id: deploy
        working-directory: infra/site
        run: |
          set -o pipefail
          npx --yes wrangler@4.156.2 pages deploy --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true \
            --commit-message "$(git log -1 --format=%s | head -c 300)" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the deployment from the outside
        if: steps.ready.outputs.go == 'true'
        run: |
          if [ -n "${{ steps.deploy.outputs.url }}" ]; then
            node hosted/scripts/smoke-site.mjs "${{ steps.deploy.outputs.url }}"
          fi
          # framedecks.com answers from the new deployment within a minute or so
          for i in 1 2 3 4 5 6; do node hosted/scripts/smoke-site.mjs https://framedecks.com && exit 0; sleep 20; done
          exit 1
