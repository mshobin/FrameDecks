name: Hosted companion checks

on:
  push:
    branches: [main, modernization-v1]
    paths:
      - "src/**"
      - "public/**"
      - "tests/hosted-boundary.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "components.json"
      - ".github/workflows/hosted.yml"
  pull_request:
    branches: [main, modernization-v1]
    paths:
      - "src/**"
      - "public/**"
      - "tests/hosted-boundary.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "components.json"
      - ".github/workflows/hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test hosted boundaries
        run: npm test

      - name: Build
        run: npm run build
