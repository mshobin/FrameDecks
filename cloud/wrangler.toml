# FrameDecks cloud API (Cloudflare Workers + D1). docs/project/saas-pwa-architecture.md §4, §14.
#
# No account id is committed: wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment.
# database_id: the placeholder below is enough for local development and tests (wrangler dev --local, vitest).
# For a real deploy, CI writes the D1 database id of that environment over the placeholder
# (secrets D1_DATABASE_ID_STAGING / D1_DATABASE_ID_PRODUCTION, see .github/workflows/cloud.yml).
# Until a domain exists (decision D4), the API is served on its free *.workers.dev address.

name = "framedecks-api"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

# Secrets (wrangler secret put …, see README): JWT_PRIVATE_KEY, JWT_KID, RESEND_API_KEY, EMAIL_FROM,
# GOOGLE_CLIENT_ID/SECRET, MICROSOFT_CLIENT_ID/SECRET, APPLE_CLIENT_ID/TEAM_ID/KEY_ID/PRIVATE_KEY.
[vars]
ENVIRONMENT = "dev"
# Origins the PWA may call the API from (CORS), comma-separated; "host:*" allows any port.
CORS_ORIGINS = "http://127.0.0.1:*,http://localhost:*"

[[d1_databases]]
binding = "DB"
database_name = "framedecks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The relay: one Durable Object per runtime (docs/architecture/relay-protocol.md). SQLite-backed (the free plan).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RuntimeRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeRelay"]

[env.staging]
name = "framedecks-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
CORS_ORIGINS = "https://framedecks.pages.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "framedecks-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.durable_objects.bindings]]
name = "RELAY"
class_name = "RuntimeRelay"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeRelay"]

[env.production]
name = "framedecks-api"

[env.production.vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://framedecks.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "framedecks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "RELAY"
class_name = "RuntimeRelay"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeRelay"]
