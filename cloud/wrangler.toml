# FrameDecks cloud API (Cloudflare Workers + D1). docs/project/saas-pwa-architecture.md §4, §14.
#
# No account id is committed: wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment.
# database_id: the placeholder below is enough for local development and tests (wrangler dev --local, vitest).
# For a real deploy, CI writes the D1 database id of that environment over the placeholder
# (secrets D1_DATABASE_ID_STAGING / D1_DATABASE_ID_PRODUCTION, see .github/workflows/cloud.yml).
# Until a domain exists (decision D4), the API is served on its free *.workers.dev address.

name = "framedecks-api"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

# Secrets (wrangler secret put …, see README): JWT_PRIVATE_KEY, JWT_KID, RESEND_API_KEY, EMAIL_FROM,
# GOOGLE_CLIENT_ID/SECRET, MICROSOFT_CLIENT_ID/SECRET, APPLE_CLIENT_ID/TEAM_ID/KEY_ID/PRIVATE_KEY.
[vars]
ENVIRONMENT = "dev"

[[d1_databases]]
binding = "DB"
database_name = "framedecks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.staging]
name = "framedecks-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "framedecks-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production]
name = "framedecks-api"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "framedecks"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
