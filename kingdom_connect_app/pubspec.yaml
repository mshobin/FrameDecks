name: kingdom_connect
description: "Kingdom Connect: ministry operations, local-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Versions are pinned (at least two weeks old when chosen). See docs/project/flutter-platform-plan.md §5.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0
  flutter_screenutil: 5.9.3
  responsive_framework: 1.5.1
  fl_chart: 1.2.0
  file_picker: 13.1.0
  excel: 4.0.6
  pdf: 3.12.0                   # 3.13 needs xml 7; excel 4.0.6 needs xml <7
  printing: 5.14.3              # matches pdf 3.12
  path_provider: 2.1.6
  intl: 0.20.3
  uuid: 4.6.0
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: 3.3.2
  build_runner: 2.15.1          # 2.15.2+ needs analyzer 13, the Isar generator needs <11

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
