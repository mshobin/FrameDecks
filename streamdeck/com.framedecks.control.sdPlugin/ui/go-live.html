<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go Live</title>
<style>
  body { margin: 0; padding: 12px 14px; background: #2d2d2d; color: #d8d8d8; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  label { display: flex; align-items: center; gap: 10px; }
  input { width: 70px; padding: 4px 6px; background: #3d3d3d; color: #fff; border: 1px solid #555; border-radius: 3px; font: inherit; }
  p { color: #a0a0a0; margin: 10px 0 0; }
</style>
</head>
<body>
<label>Frame number <input id="number" type="number" min="1" max="300" step="1" value="1"></label>
<p>The key puts this Frame on screen (1 is the first Frame in FRAMEDECKS, templates not counted) and lights up while it is there.</p>
<script>
  // Stream Deck calls this when the settings open (the standard property-inspector connection, no library needed).
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    const ws = new WebSocket("ws://127.0.0.1:" + port);
    const input = document.getElementById("number");
    const settings = (JSON.parse(actionInfo).payload || {}).settings || {};
    input.value = Number(settings.number) || 1;
    ws.onopen = function () { ws.send(JSON.stringify({ event: registerEvent, uuid: uuid })); };
    input.addEventListener("change", function () {
      const n = Math.max(1, Math.min(300, Math.round(Number(input.value) || 1)));
      input.value = n;
      ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: { number: n } }));
    });
  }
</script>
</body>
</html>
