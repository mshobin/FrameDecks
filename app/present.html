<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameDecks Share Window</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Presentation window: only the active scene. No app chrome; controls appear only when the mouse moves. */
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{cursor:none;font-family:"Segoe UI",system-ui,sans-serif}
  body.ui{cursor:default}
  #pic,#fallback{position:fixed;inset:0;width:100%;height:100%;border:0}
  #pic{object-fit:contain;display:block}
  #fallback{display:none;background:#0b1222}
  .bar{position:fixed;top:14px;right:14px;display:flex;gap:8px;opacity:0;transform:translateY(-6px);
       transition:opacity .2s ease,transform .2s ease;pointer-events:none;z-index:5}
  body.ui .bar{opacity:1;transform:none;pointer-events:auto}
  .bar button{display:inline-flex;align-items:center;gap:7px;font:600 14px/1 inherit;color:#fff;cursor:pointer;
       background:rgba(10,18,34,.86);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 13px;
       box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .bar button:hover{background:rgba(30,44,74,.95)}
  .bar button:focus-visible{outline:2px solid #e3b75a;outline-offset:2px}
  .bar .x{background:rgba(160,30,30,.9);border-color:rgba(255,255,255,.3)}
  .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#cfd8ea;font-size:13px;
        background:rgba(10,18,34,.8);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .2s}
  body.ui .hint{opacity:1}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8a97b3;font-size:15px;pointer-events:none}
  /* 9.7 Draw / Spotlight (chosen in Spotlight): the picture takes the mouse; Undo, Clear and Done near the top */
  #ink{position:fixed;display:none;touch-action:none;z-index:3}
  body.ann #ink{display:block;cursor:crosshair}
  body.ann{cursor:crosshair}
  .bar .ann-b{display:none}
  body.ann .bar .ann-b{display:inline-flex}
  body.ann .bar #exit{display:none}
  body.ann-spot .bar .draw-only{display:none}
  .bar .done{background:rgba(40,140,84,.92)}
  body.ann .hint{display:none}
</style>
</head>
<body>
<img id="pic" alt="FrameDecks Share Window">
<iframe id="fallback" title="Overlays" tabindex="-1"></iframe>
<canvas id="ink" aria-label="Draw on the picture"></canvas>
<div class="msg" id="msg">Starting the presentation…</div>
<div class="bar" role="toolbar" aria-label="Presentation controls">
  <button type="button" id="a-undo" class="ann-b draw-only" title="Undo (Ctrl+Z)">Undo</button>
  <button type="button" id="a-clear" class="ann-b draw-only" title="Clear (Delete)">Clear</button>
  <button type="button" id="fs" title="Full screen (F)">⛶ Full screen</button>
  <button type="button" id="a-done" class="ann-b done" title="Done (Esc)">✓ Done</button>
  <button type="button" id="exit" class="x" title="Close this window (Esc)">✕ Exit</button>
</div>
<div class="hint">Share this window in Zoom: Share Screen → <b>FrameDecks Share Window</b>. Esc or ✕ to exit.</div>
<script>
(function(){
  'use strict';
  var pic = document.getElementById('pic'), msg = document.getElementById('msg'), fb = document.getElementById('fallback');
  var retry = null, uiT = null, mode = 'stream';
  /* The picture: a motion-JPEG stream that only sends a frame when the scene changes. */
  function connect(){
    clearTimeout(retry);
    pic.src = 'api/present.mjpg?t=' + Date.now();
  }
  pic.addEventListener('load', function(){ msg.style.display = 'none'; });
  pic.addEventListener('error', function(){
    // Not available (start-file version without FrameDecks): show the overlay page instead.
    fetch('api/vcam/status', {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if (!d.available && mode === 'stream'){
        mode = 'overlays'; pic.style.display = 'none'; fb.style.display = 'block'; fb.src = 'stage.html?bg=dark'; msg.style.display = 'none';
      } else { msg.textContent = 'Reconnecting…'; msg.style.display = 'flex'; retry = setTimeout(connect, 2000); }
    }).catch(function(){ msg.textContent = 'Reconnecting…'; msg.style.display = 'flex'; retry = setTimeout(connect, 2000); });
  });
  connect();
  /* Controls: shown for 2 seconds after the mouse moves; nothing runs while you're not moving it. While drawing or
     with the Spotlight (9.7) only with the mouse near the top, so the audience rarely sees them. */
  function showUi(){ document.body.classList.add('ui'); clearTimeout(uiT); uiT = setTimeout(function(){ document.body.classList.remove('ui'); }, 2000); }
  document.addEventListener('mousemove', function(e){ if (!ann.mode || (e.clientY < 72 && !ann.stroke)) showUi(); }, {passive: true});
  document.addEventListener('touchstart', showUi, {passive: true});
  /* Full Screen: in the installed app the frameless window itself fills the screen (no frame, no title bar);
     in a browser popup the page's own full screen is used. */
  var desktop = false, nativeFs = false;
  fetch('api/app/present', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: true})})
    .then(function(r){ return r.json(); }).then(function(d){ desktop = !!d.desktop; nativeFs = !!d.fullscreen; }).catch(function(){});
  function setNative(want){
    return fetch('api/app/present', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fullscreen: want})})
      .then(function(r){ return r.json(); }).then(function(d){ nativeFs = !!d.fullscreen; }).catch(function(){});
  }
  function fullscreen(){
    if (desktop){ setNative('toggle'); return; }
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  }
  function exit(){
    if (desktop && nativeFs){ setNative(false); return; }       // Esc: leave full screen first
    if (document.fullscreenElement){ document.exitFullscreen(); return; }
    pic.src = '';                                   // stop the stream at once
    fetch('api/app/present', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({on: false})})
      .then(function(r){ return r.json(); }).then(function(d){ if (!d.desktop) window.close(); })
      .catch(function(){ window.close(); });
  }
  document.getElementById('fs').addEventListener('click', fullscreen);
  document.getElementById('exit').addEventListener('click', exit);
  document.addEventListener('dblclick', function(){ if (!ann.mode) fullscreen(); });

  /* ---------- 9.7 Draw and Spotlight on this window (the same rules as the native window: server.annotate_op) ---------- */
  var ann = {mode: '', tool: 'pen', c: '#e8b931', stroke: null, i: null, last: 0, click: null, at: null, ctrlAt: 0, ctrlClean: true}, cv = document.getElementById('ink');
  function annPost(body){ return fetch('api/app/annotate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(function(r){ return r.json(); }); }
  function pointer(on, p){ fetch('api/pointer', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(on ? {on: true, x: p[0], y: p[1]} : {on: false})}).catch(function(){}); }
  function fit(){                                     // the canvas lies exactly over the 16:9 picture
    var W = innerWidth, H = innerHeight, k = Math.min(W / 16, H / 9), w = Math.round(16 * k), h = Math.round(9 * k);
    cv.style.left = Math.round((W - w) / 2) + 'px'; cv.style.top = Math.round((H - h) / 2) + 'px';
    cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = w; cv.height = h;
  }
  function pt(e){ var r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1e4) / 1e4, Math.round((e.clientY - r.top) / r.height * 1e4) / 1e4]; }
  function drawLocal(){                                // the stroke being drawn, until the picture shows it
    var c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
    var s = ann.stroke; if (!s) return;
    c.strokeStyle = s.c; c.lineWidth = Math.max(2, s.w * cv.height); c.lineCap = c.lineJoin = 'round';
    c.globalAlpha = s.t === 'highlighter' ? 0.4 : 1;
    var p = s.p, a = p[0], b = p[p.length - 1], X = function(q){ return q[0] * cv.width; }, Y = function(q){ return q[1] * cv.height; };
    c.beginPath();
    if (s.t === 'rect') c.rect(X(a), Y(a), X(b) - X(a), Y(b) - Y(a));
    else if (s.t === 'ellipse') c.ellipse((X(a) + X(b)) / 2, (Y(a) + Y(b)) / 2, Math.abs(X(b) - X(a)) / 2, Math.abs(Y(b) - Y(a)) / 2, 0, 0, 7);
    else { c.moveTo(X(a), Y(a)); (s.t === 'pen' || s.t === 'highlighter' ? p : [a, b]).forEach(function(q){ c.lineTo(X(q), Y(q)); }); }
    c.stroke();
  }
  function thin(p){ if (p.length <= 600) return p; var k = Math.ceil(p.length / 600); return p.filter(function(_, i){ return i % k === 0; }).concat([p[p.length - 1]]); }
  function sendStroke(){ if (ann.i == null || !ann.stroke) return; annPost({op: 'set', i: ann.i, item: {t: ann.stroke.t, c: ann.stroke.c, w: ann.stroke.w, p: thin(ann.stroke.p.slice())}}).catch(function(){}); }
  window.KCShareAnnotate = function(mode, tool, c){
    if (ann.mode === 'spot' && mode !== 'spot') pointer(false);
    ann.mode = mode === 'draw' || mode === 'spot' ? mode : ''; if (tool) ann.tool = tool; if (c) ann.c = c;
    ann.stroke = null; document.body.classList.toggle('ann', !!ann.mode); document.body.classList.toggle('ann-spot', ann.mode === 'spot');
    fit(); drawLocal(); if (ann.mode) showUi();
  };
  annPost({op: 'get'}).then(function(d){ if (d && d.mode) KCShareAnnotate(d.mode, d.tool, d.c); }).catch(function(){});
  window.addEventListener('resize', fit);
  cv.addEventListener('pointerdown', function(e){
    if (!ann.mode) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(err){}
    var p = pt(e);
    if (ann.mode === 'spot'){                       // 9.12.1 a double-click lights the word there; one click does nothing
      var c = ann.click, now = Date.now(); ann.click = {t: now, x: e.clientX, y: e.clientY};
      if (c && now - c.t < 450 && Math.abs(e.clientX - c.x) + Math.abs(e.clientY - c.y) < 10){ ann.click = null; annPost({op: 'spot', x: p[0], y: p[1], snap: true}).catch(function(){}); }
      return;
    }
    ann.stroke = {t: ann.tool, c: ann.c, w: 0.006, p: [p, p]}; ann.i = null; drawLocal();
    annPost({op: 'add', item: ann.stroke}).then(function(d){ ann.i = d && d.i; }).catch(function(){});
  });
  cv.addEventListener('pointermove', function(e){
    if (ann.mode === 'spot'){ ann.at = pt(e); return; }   // 9.12.1 no lens follows the mouse: only where it is, for Ctrl twice
    if (!ann.stroke) return;
    var p = pt(e); if (ann.stroke.t === 'pen' || ann.stroke.t === 'highlighter') ann.stroke.p.push(p); else ann.stroke.p[1] = p;
    drawLocal();
    if (Date.now() - ann.last > 100){ ann.last = Date.now(); sendStroke(); }
  });
  cv.addEventListener('pointerup', function(e){
    if (ann.mode === 'spot') return;
    sendStroke(); ann.stroke = null; setTimeout(drawLocal, 400);
  });
  cv.addEventListener('pointerleave', function(){ ann.at = null; });
  /* 9.12.1 Ctrl twice with the mouse over the picture: the word there lights up */
  document.addEventListener('keydown', function(e){ if (e.key !== 'Control') ann.ctrlClean = false; else if (!e.repeat) ann.ctrlClean = true; }, true);
  document.addEventListener('keyup', function(e){
    if (ann.mode !== 'spot' || e.key !== 'Control' || !ann.ctrlClean) return;
    var now = Date.now();
    if (now - ann.ctrlAt < 450 && ann.at){ ann.ctrlAt = 0; annPost({op: 'spot', x: ann.at[0], y: ann.at[1], snap: true}).catch(function(){}); }
    else ann.ctrlAt = now;
  }, true);
  function done(){ annPost({op: 'mode', mode: '', hide: true}).catch(function(){}); KCShareAnnotate(''); }
  document.getElementById('a-undo').addEventListener('click', function(){ annPost({op: 'undo'}).catch(function(){}); });
  document.getElementById('a-clear').addEventListener('click', function(){ annPost({op: 'clear'}).catch(function(){}); });
  document.getElementById('a-done').addEventListener('click', done);
  var TOOLS = {'1': 'pen', '2': 'highlighter', '3': 'arrow', '4': 'rect', '5': 'ellipse'}, COLS = {g: '#e8b931', r: '#ff4b4b', w: '#ffffff'};
  document.addEventListener('keydown', function(e){
    if (!ann.mode) return;
    var k = e.key.toLowerCase();
    if (e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); done(); }
    else if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.stopImmediatePropagation(); annPost({op: 'undo'}).catch(function(){}); }
    else if (e.key === 'Delete'){ e.stopImmediatePropagation(); annPost({op: 'clear'}).catch(function(){}); }
    else if (TOOLS[e.key]){ e.stopImmediatePropagation(); ann.tool = TOOLS[e.key]; }
    else if (COLS[k] && !e.ctrlKey){ e.stopImmediatePropagation(); ann.c = COLS[k]; }
  }, true);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ e.preventDefault(); exit(); }
    else if (e.key === 'f' || e.key === 'F' || e.key === 'F11'){ e.preventDefault(); fullscreen(); }
  });
  window.addEventListener('pagehide', function(){ pic.src = ''; });   // free the stream when the window closes
})();
</script>
</body>
</html>
