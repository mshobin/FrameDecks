<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kingdom Connect · Teleprompter overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/teleprompter.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/prompter.css">
</head>
<body data-win="overlay" class="ov" data-mode="meeting" data-win-drag="move">
  <!-- Teleprompter overlay (6.8, Meeting Leader mode). Only the leader sees it: the installed app keeps it out of screen
       sharing and recordings, and no output reads the script. Built by js/prompter.js with js/teleprompter.js. -->
  <div class="ov-bg" aria-hidden="true"></div>
  <header class="ov-ribbon" data-win-drag>
    <span class="ov-grip" aria-hidden="true">⋮⋮</span>
    <b class="ov-title">Teleprompter</b>
    <span class="ov-mode" id="ov-mode-label"></span>
    <span class="ov-private">Only you see this</span>
    <div data-win-controls></div>
  </header>
  <main class="ov-main" id="ov-main" aria-label="Teleprompter"></main>
<script src="js/store.js"></script>
<script src="js/editable.js"></script>
<script src="js/teleprompter.js"></script>
<script src="js/window-chrome.js"></script>
<script src="js/prompter.js"></script>
</body>
</html>
