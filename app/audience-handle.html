<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameDecks · Audience handle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/audience.css">
<script>(function(){ var d = document.documentElement, p = 'dark';
  try { p = localStorage.getItem('kc-theme') || 'dark'; } catch(e){}
  d.dataset.theme = p === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
})();</script>
</head>
<body class="dock-handle" data-mode="click">
  <!-- 8.8 the Audience Dock's handle: a small bar on the dock's top edge that always takes clicks (the dock itself lets
       clicks through). Drag, resize, keep the dock usable, settings, close. -->
  <div class="dh-bar" role="toolbar" aria-label="Audience Dock">
    <button class="dh-btn dh-drag" type="button" id="dh-drag" title="Move the dock (drag)" aria-label="Move the dock">⠿</button>
    <span class="dh-dot" aria-hidden="true"></span>
    <button class="dh-btn" type="button" id="dh-resize" title="Resize the dock (drag)" aria-label="Resize the dock">⤡</button>
    <button class="dh-btn" type="button" id="dh-pin" aria-pressed="false" title="Keep the dock usable (to type in a card)" aria-label="Keep the dock usable">📌</button>
    <button class="dh-btn" type="button" id="dh-settings" aria-pressed="false" title="Settings" aria-label="Settings">⚙</button>
    <button class="dh-btn dh-close" type="button" id="dh-close" title="Close the dock (Capture stops)" aria-label="Close the dock">✕</button>
  </div>
  <script src="js/audience.js"></script>
</body>
</html>
