<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameDecks · Spotlight</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/window.css">
<script>/* the same appearance as the main window */
(function(){ var d = document.documentElement, p = 'dark';
  try { p = localStorage.getItem('kc-theme') || 'dark'; } catch(e){}
  d.dataset.theme = p === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
})();</script>
</head>
<body data-win="spotlight" class="spotlight">
  <!-- Spotlight (6.8): a small always-on-top window, opened with the system-wide shortcut (Settings > General >
       Window and tray), also while FrameDecks is in the tray. It is the command palette (js/palette.js);
       the main window builds the list and does what you choose. -->
<script src="js/store.js"></script>
<script src="js/palette.js"></script>
</body>
</html>
