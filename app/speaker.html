<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameDecks · Teleprompter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/speaker.css">
<link rel="stylesheet" href="css/teleprompter.css">
<link rel="stylesheet" href="css/window.css">
<script>/* Look and light or dark before the first paint (Settings > Meeting & Branding > Look). 8.1: a look (the same six as
   framedecks.com, or "same as my workspace") and Dark / Light / Match Windows; 7.x "Follow my workspace" becomes a look. */
(function(){ var d = document.documentElement, p = 'dark', lk = 'gold-navy', wb = 'dark', wl = 'gold-navy';
  try { p = localStorage.getItem('kc-theme') || 'dark'; lk = localStorage.getItem('kc-look') || 'gold-navy';
    wb = localStorage.getItem('kc-theme-base') === 'light' ? 'light' : 'dark'; wl = localStorage.getItem('kc-ws-look') || 'gold-navy'; } catch(e){}
  if (p === 'workspace'){ lk = 'workspace'; p = 'dark'; }
  d.dataset.themePref = p; d.dataset.lookPref = lk; d.dataset.look = lk === 'workspace' ? wl : lk;
  d.dataset.theme = lk === 'workspace' ? wb : p === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
})();</script>
</head>
<body class="speaker" data-win="teleprompter">
  <!-- The Teleprompter (8.0: the one Teleprompter, an overlay above Zoom and Teams). Only you see it: the installed app
       keeps it out of screen sharing and recordings. The top bar (time, Frame, timer) stays hidden until the pointer
       is near the top or the bar button is pressed. Built by js/speaker.js with js/teleprompter.js. -->
  <div class="sp-head" id="sp-head">
    <button class="sp-bar-btn" type="button" id="sp-bar-btn" aria-expanded="false" aria-controls="sp-top" aria-label="Show the top bar" title="Show the top bar: time, Frame and timer"><span aria-hidden="true">▾</span></button>
    <header class="sp-top" id="sp-top" data-win-drag>
      <div class="sp-row">
        <div class="sp-clock"><span>Time</span><b id="sp-clock">--:--</b></div>
        <div class="sp-clock sp-frame"><span>Frame</span><b id="sp-frame-pos">–</b></div>
        <button class="sp-next" type="button" id="sp-next" title="Put the next Frame on screen">Next Frame <span aria-hidden="true">▸</span></button>
        <div class="sp-clock sp-watch"><span>Timer</span><b id="sp-watch">0:00</b>
          <div class="sp-watch-btns"><button class="btn small" type="button" id="sp-watch-go">Start</button><button class="btn quiet small" type="button" id="sp-watch-reset">Reset</button></div></div>
        <div class="sp-look" id="sp-look" role="radiogroup" aria-label="Transparency" hidden>
          <button type="button" role="radio" data-look="solid" title="Solid">Solid</button><button type="button" role="radio" data-look="presenter" title="20 % see-through">20%</button><button type="button" role="radio" data-look="meeting" title="40 % see-through">40%</button><button type="button" role="radio" data-look="conference" title="65 % see-through">65%</button><button type="button" role="radio" data-look="ghost" title="85 % see-through">85%</button></div>
        <button class="sp-pin" type="button" id="sp-pin" aria-pressed="true" hidden title="Pinned: stays above Zoom, Teams and PowerPoint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.8V5h6v5.8l2.5 3.2H6.5z"/><path d="M8 5h8"/></svg><span>Pinned</span></button>
        <button class="btn quiet small sp-bar-pin" type="button" id="sp-bar-pin" aria-controls="sp-top" title="Keep the top bar open">Keep open</button>
        <div data-win-controls></div>
      </div>
      <div class="sp-row sp-tools" id="sp-tools" data-no-drag>
        <div class="sp-ctl" id="sp-ctl"></div>
        <button class="sp-act" type="button" id="sp-write">✎ Write Script</button>
        <button class="sp-act" type="button" id="sp-upload" title="Load a script from a .txt, .md or Word (.docx) file">⇪ Upload</button>
        <input type="file" id="sp-file" hidden>
        <div class="sp-mode" role="radiogroup" aria-label="Script">
          <button type="button" role="radio" data-mode="frame" aria-checked="true" title="Each Frame has its own script">Each Frame</button><button type="button" role="radio" data-mode="all" aria-checked="false" title="One script for the whole meeting">Whole meeting</button></div>
      </div>
    </header>
  </div>
  <main class="sp-main"><section class="sp-prompt" id="sp-prompt" aria-label="Teleprompter" tabindex="-1"></section></main>
<script src="js/store.js"></script>
<script src="js/editable.js"></script>
<script src="js/teleprompter.js"></script>
<script src="js/script-file.js"></script>
<script src="js/window-chrome.js"></script>
<script src="js/speaker.js"></script>
</body>
</html>
