<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameDecks Stage screen</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/stage-display.css">
</head>
<body class="sd">
<!-- 26.11.57 the stage screen (confidence monitor) for musicians and speakers: what is on screen now in large letters,
     what comes next, the clock, the time left in this part of the service, and a message from the person running the
     meeting. Open it on a second screen at the front, or on a tablet signed in to the phone remote (js/stage-display.js). -->
<main class="sd-main" aria-live="polite">
  <header class="sd-top">
    <span class="sd-where" id="sd-where">Waiting for the meeting…</span>
    <span class="sd-left" id="sd-left" hidden></span>
    <time class="sd-clock" id="sd-clock"></time>
  </header>
  <p class="sd-msg" id="sd-msg" role="alert" hidden></p>
  <section class="sd-now"><span class="sd-k" id="sd-now-k">On screen</span><div class="sd-text" id="sd-now"></div></section>
  <section class="sd-next"><span class="sd-k">Next</span><div class="sd-ntext" id="sd-next"></div></section>
  <p class="sd-auth" id="sd-auth" hidden>Sign in on the phone remote first (the PIN on the FrameDecks PC), then open this page again.</p>
</main>
<script src="js/store.js"></script>
<script src="js/stage-display.js"></script>
</body>
</html>
