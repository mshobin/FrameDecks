<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameDecks · Chat Bubble</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/memory.css">
<script>(function(){ var d = document.documentElement, p = 'dark';
  try { p = localStorage.getItem('kc-theme') || 'dark'; } catch(e){}
  d.dataset.theme = p === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p === 'light' ? 'light' : 'dark');
})();</script>
</head>
<body class="mem-popup">
  <!-- 9.0 the Chat Bubble popup: the cards just copied, in the screen corner, with Show and Pin. It never takes the
       keyboard from the meeting and screen sharing leaves it out (src/desktop_app.py popup_show). -->
  <main class="pop" id="pop" aria-label="New Chat Bubbles">
    <ol class="mem-list pop-list" id="pop-list"></ol>
  </main>
  <script src="js/memory.js"></script>
</body>
</html>
